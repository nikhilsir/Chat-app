name: Apply Fixed Chat App ZIP on: workflow_dispatch: {} permissions: contents: write jobs: update-project: runs-on: ubuntu-latest steps: - name: Checkout repository uses: actions/checkout@v4 - name: Check ZIP file shell: bash run: | test -f "Chat-app-render-fixed-1.zip" || { echo "ZIP file nahi mili" exit 1 } - name: Extract ZIP file shell: bash run: | mkdir -p /tmp/fixed unzip -q "Chat-app-render-fixed-1.zip" -d /tmp/fixed find /tmp/fixed -maxdepth 3 -type d - name: Apply project files shell: bash run: | if [ -d "/tmp/fixed/Chat-app-main" ]; then cp -a /tmp/fixed/Chat-app-main/. . else echo "ZIP ke andar Chat-app-main folder nahi mila" exit 1 fi - name: Commit updated files shell: bash run: | git config user.name "github-actions[bot]" git config user.email "41898282+users.noreply.github.com" git add -A if ! git diff --cached --quiet; then git commit -m "Apply fixed Chat app files" git push else echo "Koi naya change nahi mila" fi
