name: Apply Fixed Chat App ZIP
on: 
   workflow_dispatch: 
   permissions: 
   contents: write
   jobs:
   update-project:
   runs-on: ubuntu-latest
   steps: 
        - name: Checkout repository 
        uses: actions/checkout@v4
        name: Check ZIP file 
        run: | 
        if 
        [ ! -f "Chat-app-render-fixed-1.zip" ]; then 
       echo "ERROR: ZIP file repository root mein nahi mili."
          exit 1 
               fi 
     - name: Extract ZIP file
               run: | 
               mkdir -p /tmp/fixed
               unzip -q Chat-app-render-fixed-1.zip -d /tmp/fixed 
               echo "ZIP extracted successfully."
               find /tmp/fixed -maxdepth 2 -type f | head -50
                - name: Apply project files
                run: | 
                if [ -d "/tmp/fixed/Chat-app-main" ]; then 
                cp -a /tmp/fixed/Chat-app-main/. . 
                else 
                echo "ERROR: ZIP ke andar Chat-app-main folder nahi mila." 
                find /tmp/fixed -maxdepth 2 -type d 
                exit 1
                fi 
                - name: Commit updated files 
                run: | 
                git config user.name "github-actions[bot]"
                git config user.email "41898282+users.noreply.github.com" 
                git add -A 
                if git diff --cached --quiet; then 
                echo "Koi naya change nahi mila."
                else 
                git commit -m "Apply fixed Chat app files"
                git push
                fi
